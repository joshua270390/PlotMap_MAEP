name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # Ubuntu 24.04 already includes the Android SDK required by Capacitor 7.
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK 35 is ready"
      - name: Build web
        run: |
          npm install
          npm run build
      - name: Add Capacitor Android
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3
          npx cap add android
          mkdir -p assets
          cp public/mary-ann-logo.svg assets/logo.svg 2>/dev/null || true
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#07533e' || true
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../MaryAnn-PlotMap.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Mary Ann Plot Map App
          body: Latest Android app. Download MaryAnn-PlotMap.apk and install.
          make_latest: true
          files: MaryAnn-PlotMap.apk
